<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoctorSleep - Login</title>
    <!-- Importando o SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #050508;
            color: #e2e2e7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Fundo de Vídeo em Loop */
        .video-bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: #000;
        }

        #bgVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65) contrast(1.05);
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.55);
        }

        /* Container de Login com Efeito de Vidro Escuro */
        .login-container {
            background: rgba(15, 15, 20, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .login-logo {
            font-size: 28px;
            font-weight: 700;
            font-style: italic;
            margin-bottom: 8px;
            cursor: pointer;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #9898a6;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            color: #e2e2e7;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s, border-color 0.2s;
            margin-bottom: 20px;
        }

        .google-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
            color: #71717a;
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #d4d4d8;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(10, 10, 14, 0.5);
            border-radius: 10px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: rgba(110, 142, 215, 0.6);
            box-shadow: 0 0 12px rgba(110, 142, 215, 0.2);
        }

        .submit-btn {
            width: 100%;
            background-color: #415a77;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(65, 90, 119, 0.4);
        }

        .submit-btn:hover {
            background-color: #527196;
            transform: scale(1.02);
        }

        .signup-text {
            font-size: 13px;
            color: #9898a6;
            text-align: center;
            line-height: 1.4;
        }

        .footer-terms {
            font-size: 12px;
            color: #71717a;
            text-align: center;
            max-width: 380px;
            margin-top: 30px;
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Fundo de Vídeo em Loop -->
    <div class="video-bg-container">
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="bg-login.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="login-container">
        <div class="login-logo" onclick="window.location.href='sleep.html'">
            <span style="color: #ffffff;">Doctor</span><span style="color: #7b9acc;">Sleep</span>
        </div>
        <p class="login-subtitle">Inicie sessão ou cadastre-se para aceder ao seu espaço de descanso e saúde do sono.</p>

        <div id="errorContainer" class="error-msg"></div>

        <button class="google-btn" onclick="loginComGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.21 21.32 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 11.7c0 1.83.43 3.57 1.19 5.1l4.08-2.56z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.21 2.68 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            Continuar com o Google
        </button>

        <div class="divider">ou</div>

        <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-input" id="loginEmail" placeholder="você@exemplo.com">
        </div>

        <div class="form-group">
            <label class="form-label">Senha</label>
            <input type="password" class="form-input" id="loginPassword" placeholder="••••••••">
        </div>

        <button class="submit-btn" onclick="entrarOuCadastrar()">Entrar / Cadastrar</button>

        <div class="signup-text">
            Já tem conta? O sistema cadastra automaticamente se o e-mail for novo!
        </div>
    </div>

    <div class="footer-terms">
        Ao iniciar sessão, você concorda com nossos termos de serviço e diretrizes de bem-estar.
    </div>

    <script>
        const SUPABASE_URL = 'https://edrmehdyusznzdltlhxz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkcm1laGR5dXN6bnpkbHRsaHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjcxMDUsImV4cCI6MjEwNTgwMzEwNX0.TDclKranm8q1Zcb2ngv6lgflM4yU5fpANLVuyJer6gk';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const errorContainer = document.getElementById('errorContainer');

        async function irParaChat(user) {
            const apelido = user.email ? user.email.split('@')[0] : 'usuario';
            localStorage.setItem('usuarioLogado', 'true');
            localStorage.setItem('nomeUsuario', apelido);
            // Garante o redirecionamento restrito para o DoctorSleep
            window.location.replace('sleep.html');
        }

        async function entrarOuCadastrar() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            errorContainer.innerText = '';

            if (!email || !password) {
                errorContainer.innerText = 'Preencha o e-mail e a senha.';
                return;
            }

            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                let { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });
                if (signUpError) {
                    errorContainer.innerText = signUpError.message;
                    return;
                }
                data = signUpData;
            }

            if (data.user || data.session) {
                await irParaChat(data.user || data.session.user);
            }
        }

        async function loginComGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { 
                    redirectTo: window.location.origin + '/sleep.html',
                    queryParams: { prompt: 'select_account' }
                }
            });
            if (error) errorContainer.innerText = error.message;
        }

        // Verifica a sessão ativa ou o retorno do OAuth do Google de forma robusta
        window.addEventListener('DOMContentLoaded', async () => {
            // Verifica se já existe uma sessão ativa
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                await irParaChat(session.user);
                return;
            }

            // Ouve alterações de autenticação caso o token venha via hash/query parameters do OAuth
            supabaseClient.auth.onAuthStateChange(async (event, currentSession) => {
                if (currentSession && currentSession.user) {
                    await irParaChat(currentSession.user);
                }
            });
        });
    </script>
</body>
</html>
